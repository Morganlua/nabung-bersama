<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nabung Bersama - Pengingat & Tabungan</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF9E6; --card-bg: #FFFFFF; --text-color: #121212; --border-color: #121212;
            --primary-accent: #8B5CF6; --secondary-accent: #10B981; --warning-accent: #F59E0B; --danger-accent: #EF4444;
            --shadow: 4px 4px 0px #121212; --shadow-lg: 6px 6px 0px #121212;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --card-bg: #1E1E2E; --text-color: #F3F4F6; --border-color: #FFFFFF;
            --primary-accent: #A78BFA; --secondary-accent: #34D399; --warning-accent: #FBBF24; --danger-accent: #F87171;
            --shadow: 4px 4px 0px #FFFFFF; --shadow-lg: 6px 6px 0px #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; max-width: 480px; margin: 0 auto; padding-bottom: 90px; }
        .header-card { background: var(--primary-accent); border: 3px solid var(--border-color); box-shadow: var(--shadow-lg); border-radius: 16px; padding: 20px; color: #FFFFFF; margin-bottom: 20px; }
        .header-title { font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
        .badge-level { background: var(--warning-accent); color: #121212; border: 2px solid var(--border-color); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .theme-toggle { background: var(--card-bg); border: 2px solid var(--border-color); padding: 6px 12px; border-radius: 10px; cursor: pointer; font-weight: 700; color: var(--text-color); box-shadow: 2px 2px 0px var(--border-color); }
        .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .tab-btn { background: var(--card-bg); border: 2.5px solid var(--border-color); padding: 10px 4px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; color: var(--text-color); box-shadow: var(--shadow); text-align: center; }
        .tab-btn.active { background: var(--secondary-accent); color: #121212; transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border-color); }
        .section-card { background: var(--card-bg); border: 3px solid var(--border-color); box-shadow: var(--shadow); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 10px; border: 2.5px solid var(--border-color); border-radius: 10px; background: var(--card-bg); color: var(--text-color); font-weight: 600; font-size: 14px; }
        .btn-action { width: 100%; background: var(--primary-accent); color: #FFFFFF; border: 2.5px solid var(--border-color); padding: 12px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); margin-top: 8px; }
        .item-card { background: var(--card-bg); border: 2.5px solid var(--border-color); box-shadow: 3px 3px 0px var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .progress-bar-bg { width: 100%; height: 14px; background: #E5E7EB; border: 2px solid var(--border-color); border-radius: 10px; overflow: hidden; margin: 8px 0; }
        .progress-bar-fill { height: 100%; background: var(--secondary-accent); width: 0%; }
        .quick-deposit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .btn-quick { background: var(--card-bg); border: 2px solid var(--border-color); padding: 6px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; color: var(--text-color); }
    </style>
</head>
<body>
    <div class="header-card">
        <div class="header-title">
            <span>Nabung Bersama</span>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Theme</button>
        </div>
        <div style="margin-top: 10px; display: flex; gap: 8px; align-items: center;">
            <span class="badge-level">Level 1 - Pemula</span>
            <span style="font-size: 12px; font-weight: 700;">PROD v1.0</span>
        </div>
    </div>
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-schedule', this)">⏰ Jadwal</button>
        <button class="tab-btn" onclick="switchTab('tab-savings', this)">💰 Tabungan</button>
        <button class="tab-btn" onclick="switchTab('tab-profile', this)">👤 Profil</button>
        <button class="tab-btn" onclick="switchTab('tab-settings', this)">⚙️ Setting</button>
    </div>
    <div id="tab-schedule" class="tab-content">
        <div class="section-card">
            <div class="section-title">📌 Tambah Pengingat Jadwal</div>
            <div class="form-group"><label class="form-label">Nama Agenda / Kegiatan</label><input type="text" id="sch-title" class="form-input" placeholder="Misal: Restock Saldo / Scripting"></div>
            <div class="form-group"><label class="form-label">Tanggal & Waktu</label><input type="datetime-local" id="sch-time" class="form-input"></div>
            <button class="btn-action" onclick="addSchedule()">SIMPAN JADWAL 🚀</button>
        </div>
        <div class="section-card">
            <div class="section-title">📋 Daftar Jadwal Aktif</div>
            <div id="schedule-list"></div>
        </div>
    </div>
    <div id="tab-savings" class="tab-content" style="display: none;">
        <div class="section-card">
            <div class="section-title">🎯 Target Tabungan</div>
            <div class="form-group"><label class="form-label">Nama Target</label><input type="text" id="sav-title" class="form-input" placeholder="Misal: Beli VPS / Laptop"></div>
            <div class="form-group"><label class="form-label">Target Nominal (Rp)</label><input type="number" id="sav-target" class="form-input" placeholder="500000"></div>
            <button class="btn-action" style="background: var(--secondary-accent); color: #121212;" onclick="addSavingsTarget()">BUAT TARGET 🎯</button>
        </div>
        <div class="section-card">
            <div class="section-title">📊 Progress Tabungan</div>
            <div id="savings-list"></div>
        </div>
    </div>
    <div id="tab-profile" class="tab-content" style="display: none;">
        <div class="section-card" style="text-align: center;">
            <div style="font-size: 40px; margin-bottom: 8px;">👨‍💻</div>
            <h3 style="font-weight: 800;">Morgan Developer</h3>
            <p style="font-size: 12px; color: var(--primary-accent); font-weight: 700; margin-top: 4px;">Nabung Bersama App</p>
            <div style="margin-top: 16px; border-top: 2px dashed var(--border-color); padding-top: 12px; font-size: 13px; text-align: left;">
                <p><strong>Total Jadwal:</strong> <span id="stat-schedule">0</span> Agenda</p>
                <p style="margin-top: 6px;"><strong>Total Target:</strong> <span id="stat-savings">0</span> Target</p>
            </div>
        </div>
    </div>
    <div id="tab-settings" class="tab-content" style="display: none;">
        <div class="section-card">
            <div class="section-title">⚙️ Pengaturan Notifikasi</div>
            <button class="btn-action" style="background: var(--warning-accent); color: #121212;" onclick="requestNotifPermission()">Minta Izin Notifikasi HP 🔔</button>
            <button class="btn-action" style="background: var(--danger-accent); margin-top: 10px;" onclick="clearAllData()">Reset Semua Data 🗑️</button>
        </div>
    </div>
    <script>
        let schedules = JSON.parse(localStorage.getItem('m_schedules') || '[]');
        let savings = JSON.parse(localStorage.getItem('m_savings') || '[]');
        function toggleTheme() { document.body.getAttribute('data-theme') === 'dark' ? document.body.removeAttribute('data-theme') : document.body.setAttribute('data-theme', 'dark'); }
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }
        function requestNotifPermission() {
            if ("Notification" in window) { Notification.requestPermission().then(p => alert("Status Notifikasi: " + p)); }
            else { alert("Browser tidak mendukung."); }
        }
        function addSchedule() {
            const title = document.getElementById('sch-title').value;
            const time = document.getElementById('sch-time').value;
            if(!title || !time) return alert("Isi nama agenda dan waktunya!");
            schedules.push({ id: Date.now(), title, time });
            localStorage.setItem('m_schedules', JSON.stringify(schedules));
            renderSchedules();
            document.getElementById('sch-title').value = ''; document.getElementById('sch-time').value = '';
        }
        function renderSchedules() {
            const container = document.getElementById('schedule-list'); container.innerHTML = '';
            schedules.forEach(item => {
                container.innerHTML += `<div class="item-card"><div><div style="font-weight:800; font-size:14px;">${item.title}</div><div style="font-size:11px; opacity:0.8;">🕒 ${new Date(item.time).toLocaleString('id-ID')}</div></div><button onclick="deleteSchedule(${item.id})" style="background:var(--danger-accent); color:#fff; border:2px solid var(--border-color); border-radius:6px; padding:4px 8px; font-weight:700; cursor:pointer;">X</button></div>`;
            });
            document.getElementById('stat-schedule').innerText = schedules.length;
        }
        function deleteSchedule(id) { schedules = schedules.filter(i => i.id !== id); localStorage.setItem('m_schedules', JSON.stringify(schedules)); renderSchedules(); }
        function addSavingsTarget() {
            const title = document.getElementById('sav-title').value;
            const target = parseFloat(document.getElementById('sav-target').value);
            if(!title || !target) return alert("Isi target dan nominal!");
            savings.push({ id: Date.now(), title, target, current: 0 });
            localStorage.setItem('m_savings', JSON.stringify(savings));
            renderSavings();
            document.getElementById('sav-title').value = ''; document.getElementById('sav-target').value = '';
        }
        function depositSavings(id, amount) {
            const item = savings.find(i => i.id === id);
            if(item) { item.current += amount; localStorage.setItem('m_savings', JSON.stringify(savings)); renderSavings(); }
        }
        function renderSavings() {
            const container = document.getElementById('savings-list'); container.innerHTML = '';
            savings.forEach(item => {
                const percent = Math.min(100, Math.round((item.current / item.target) * 100));
                container.innerHTML += `<div class="item-card" style="flex-direction:column; align-items:stretch;"><div style="display:flex; justify-content:space-between; font-weight:800;"><span>${item.title}</span><span>${percent}%</span></div><div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%;"></div></div><div style="font-size:12px; font-weight:700; display:flex; justify-content:space-between;"><span>Rp ${item.current.toLocaleString('id-ID')}</span><span>Target: Rp ${item.target.toLocaleString('id-ID')}</span></div><div class="quick-deposit-grid"><button class="btn-quick" onclick="depositSavings(${item.id}, 10000)">+10Rb</button><button class="btn-quick" onclick="depositSavings(${item.id}, 50000)">+50Rb</button><button class="btn-quick" onclick="depositSavings(${item.id}, 100000)">+100Rb</button></div></div>`;
            });
            document.getElementById('stat-savings').innerText = savings.length;
        }
        function clearAllData() { if(confirm("Hapus semua data?")) { localStorage.clear(); schedules = []; savings = []; renderSchedules(); renderSavings(); } }
        renderSchedules(); renderSavings();
    </script>
</body>
</html>
